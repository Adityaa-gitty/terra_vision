<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terra Vision | Hazard & Risk Analytics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body, html {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
            color: #ffffff;
        }

        .navbar-custom {
            background: rgba(15, 23, 42, 0.98);
            border-bottom: 2px solid rgba(245, 158, 11, 0.4);
        }

        .analytics-container {
            padding: 3rem;
            max-width: 1000px;
            margin: 0 auto;
        }

        .chart-card {
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid rgba(245, 158, 11, 0.5);
            border-radius: 1.5rem;
            padding: 2.5rem;
            text-align: center;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        .btn-custom {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #030712;
            font-weight: 800;
            border-radius: 0.75rem;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-custom:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(245, 158, 11, 0.5);
            color: #030712;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-custom px-4 py-3">
        <a class="navbar-brand fw-extrabold text-warning tracking-wider" href="#">TERRA VISION 📈</a>
        <a href="/india-map" class="btn btn-sm btn-outline-warning fw-bold">🗺️ Back to Map</a>
    </nav>

    <div class="analytics-container">
        <div class="chart-card">
            <h2 class="fw-extrabold text-warning mb-2">AI Trek Hazard & Risk Curve</h2>
            <p class="text-secondary small mb-4">Advanced Seaborn regression analysis mapping trail elevation gain against distance to evaluate physical risk thresholds.</p>

            <div id="chartLoader" class="py-5 text-secondary">
                <div class="spinner-border text-warning mb-3" role="status"></div>
                <p>Computing geospatial hazard regression model...</p>
            </div>

            <div id="chartContainer" style="display: none;">
                <img id="analyticsImage" class="img-fluid rounded border border-secondary shadow-lg" alt="Hazard Risk Curve">
            </div>

            <div class="mt-4">
                <a href="/india-map" class="btn btn-custom">Proceed to Map Exploration 🧭</a>
            </div>
        </div>
    </div>

    <script>
        fetch('/api/analytics-chart')
            .then(response => response.json())
            .then(data => {
                document.getElementById('chartLoader').style.display = 'none';
                if (data.status === 'success' && data.chart) {
                    document.getElementById('analyticsImage').src = 'data:image/png;base64,' + data.chart;
                    document.getElementById('chartContainer').style.display = 'block';
                } else {
                    document.getElementById('chartContainer').innerHTML = '<p class="text-danger">Unable to load hazard curve. Ensure trek database is synced.</p>';
                    document.getElementById('chartContainer').style.display = 'block';
                }
            })
            .catch(error => {
                document.getElementById('chartLoader').style.display = 'none';
                document.getElementById('chartContainer').innerHTML = '<p class="text-danger">Error fetching analytics data.</p>';
                document.getElementById('chartContainer').style.display = 'block';
            });
    </script>

</body>
</html>
