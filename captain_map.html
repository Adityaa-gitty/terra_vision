<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terra Vision | Captain's Map</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body, html {
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background-color: #030712;
            color: #ffffff;
        }

        /* Fixed Stacking: Positive Z-index so Jack Sparrow video is fully visible */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }

        .video-bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.85) contrast(1.15);
        }

        /* Cinematic Overlay for sharp video contrast and readability */
        .overlay-content {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 3rem;
            background: rgba(3, 7, 18, 0.45);
            backdrop-filter: blur(3px);
            z-index: 2;
            position: relative;
        }

        .pirate-card {
            background: rgba(15, 23, 42, 0.88);
            backdrop-filter: blur(16px);
            border: 2px solid rgba(245, 158, 11, 0.6);
            border-radius: 1.5rem;
            padding: 2.5rem 3.5rem;
            text-align: center;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 30px rgba(245, 158, 11, 0.25);
            animation: floatCard 4s ease-in-out infinite;
            z-index: 3;
        }

        @keyframes floatCard {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .btn-pirate {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #030712;
            font-weight: 800;
            border: none;
            border-radius: 0.75rem;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .btn-pirate:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 35px rgba(245, 158, 11, 0.7);
            color: #030712;
        }
    </style>
</head>
<body>

    <!-- Jack Sparrow Video Background with Positive Z-Index -->
    <div class="video-bg">
        <video id="jackVideo" autoplay muted loop playsinline preload="auto">
            <source src="{{ url_for('static', filename='pirates_video.mp4') }}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <div class="overlay-content">
        <div style="z-index: 3;">
            <h1 class="fw-extrabold text-warning tracking-wider mb-1" style="text-shadow: 0 2px 15px rgba(245,158,11,0.6);">TERRA VISION</h1>
            <p class="text-light small fw-bold tracking-widest text-uppercase">The Captain's Geospatial Map</p>
        </div>

        <div class="pirate-card">
            <h3 class="fw-bold mb-3 text-warning">🧭 "Now, bring me that horizon."</h3>
            <p class="text-secondary small mb-4">The magical compass points true. Select your destination on the map of India.</p>
            <a href="/india-map" class="btn btn-pirate">Open India Trekking Map 🚀</a>
        </div>

        <div class="text-muted small" style="z-index: 3;">
            <span>Terra Vision Secure Session • Powered by Captain Jack Sparrow's Compass</span>
        </div>
    </div>

    <script>
        // Force play script to ensure video starts immediately
        document.addEventListener("DOMContentLoaded", function() {
            var video = document.getElementById('jackVideo');
            video.play().catch(function(error) {
                console.log("Autoplay prevented:", error);
            });
        });
    </script>
</body>
</html>
