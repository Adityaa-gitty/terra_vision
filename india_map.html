<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terra Vision | Interactive India Trek Map</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body, html {
            font-family: 'Plus Jakarta Sans', sans-serif;
            height: 100%;
            margin: 0;
            background-color: #030712;
            color: #ffffff;
            overflow: hidden;
        }

        .navbar-custom {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(245, 158, 11, 0.2);
        }

        #map {
            height: calc(100vh - 75px);
            width: 100%;
            z-index: 1;
        }

        /* Floating Control & Info Panel */
        .map-control-card {
            position: absolute;
            top: 95px;
            right: 25px;
            width: 380px;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 1.25rem;
            padding: 1.5rem;
            z-index: 1000;
            box-shadow: 0 25px 50px rgba(0,0,0,0.8);
        }

        /* Quick Region Presets */
        .region-pill {
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #94a3b8;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .region-pill:hover, .region-pill.active {
            background: #f59e0b;
            color: #030712;
            border-color: #f59e0b;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.5);
        }

        .btn-trek {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #030712;
            font-weight: 800;
            border: none;
            border-radius: 0.75rem;
            padding: 0.85rem;
            transition: all 0.3s ease;
        }

        .btn-trek:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.5);
            color: #030712;
        }

        .btn-trek:disabled {
            background: #334155;
            color: #64748b;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-custom px-4 py-3">
        <a class="navbar-brand fw-extrabold text-warning tracking-wider" href="#">TERRA VISION 🗺️</a>
        <span class="text-secondary small">Explore & Pinpoint Your Himalayan & Indian Expeditions</span>
    </nav>

    <div id="map"></div>

    <div class="map-control-card">
        <h5 class="fw-bold text-warning mb-2">🧭 Captain's Navigation</h5>
        <p class="text-secondary small mb-3">Click anywhere on the map or select a famous trekking hotspot below to analyze routes.</p>
        
        <label class="text-light small fw-bold mb-2 d-block">Quick Region Hotspots:</label>
        <div class="d-flex flex-wrap gap-2 mb-3">
            <span class="region-pill" onclick="flyToRegion(34.1526, 77.5771, 8, 'Ladakh Range')">⛰️ Ladakh</span>
            <span class="region-pill" onclick="flyToRegion(32.2432, 77.1892, 9, 'Himachal Trails')">🌲 Himachal</span>
            <span class="region-pill" onclick="flyToRegion(30.0869, 79.0041, 9, 'Uttarakhand Peaks')">🏔️ Uttarakhand</span>
            <span class="region-pill" onclick="flyToRegion(11.4102, 76.6950, 9, 'Western Ghats')">🌿 Western Ghats</span>
        </div>

        <div id="selectedLocationInfo" class="mb-3 p-3 rounded bg-dark border border-secondary">
            <span class="text-warning small fw-semibold">Status: Waiting for pin drop...</span>
        </div>

        <form action="/health-questionnaire" method="POST">
            <input type="hidden" name="selected_lat" id="selectedLat">
            <input type="hidden" name="selected_lng" id="selectedLng">
            <button type="submit" id="proceedBtn" class="btn btn-trek w-100" disabled>Proceed to Fitness Analysis 🚀</button>
        </form>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Initialize Map centered over India
        var map = L.map('map', {zoomControl: false}).setView([22.5937, 78.9629], 5);

        // Add custom zoom control to top-left
        L.control.zoom({position: 'topleft'}).addTo(map);

        // Dark futuristic tile layer
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://carto.com/">CARTO</a>',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        var currentMarker = null;

        // Function for Region Presets
        function flyToRegion(lat, lng, zoom, name) {
            map.flyTo([lat, lng], zoom, {
                duration: 2.0
            });
            setPin(lat, lng, name);
        }

        function setPin(lat, lng, label) {
            document.getElementById('selectedLat').value = lat;
            document.getElementById('selectedLng').value = lng;

            if (currentMarker) {
                map.removeLayer(currentMarker);
            }
            currentMarker = L.marker([lat, lng]).addTo(map)
                .bindPopup(`<b>Hotspot: ${label}</b><br>Lat: ${lat}, Lng: ${lng}`)
                .openPopup();

            document.getElementById('selectedLocationInfo').innerHTML = `
                <span class="text-success small fw-bold">📍 ${label} Selected!</span><br>
                <span class="text-light small">Latitude: ${lat}</span><br>
                <span class="text-light small">Longitude: ${lng}</span>
            `;
            document.getElementById('proceedBtn').removeAttribute('disabled');
        }

        // Map Click Event
        map.on('click', function(e) {
            var lat = e.latlng.lat.toFixed(4);
            var lng = e.latlng.lng.toFixed(4);
            setPin(lat, lng, 'Custom Coordinates');
        });
    </script>
</body>
</html>
