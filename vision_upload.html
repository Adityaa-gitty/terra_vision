<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terra Vision | AI Terrain Vision Classifier</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body, html {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #030712;
            color: #ffffff;
            height: 100%;
        }

        .navbar-custom {
            background: rgba(15, 23, 42, 0.98);
            border-bottom: 2px solid rgba(245, 158, 11, 0.4);
        }

        .wrapper-center {
            padding: 3rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 75px);
        }

        .vision-card {
            background: rgba(15, 23, 42, 0.95);
            border: 2px solid rgba(245, 158, 11, 0.6);
            border-radius: 1.5rem;
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            width: 100%;
            max-width: 650px;
            padding: 3rem;
            text-align: center;
        }

        .form-control {
            background: rgba(30, 41, 59, 1);
            border: 2px solid #64748b;
            color: #ffffff;
            border-radius: 0.75rem;
            padding: 0.85rem;
        }

        .form-control:focus {
            background: rgba(30, 41, 59, 1);
            border-color: #f59e0b;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
        }

        .btn-vision {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
            color: #030712;
            font-weight: 800;
            border: none;
            border-radius: 0.75rem;
            padding: 1rem;
            font-size: 1.1rem;
            box-shadow: 0 10px 25px rgba(245, 158, 11, 0.4);
            transition: all 0.3s ease;
        }

        .btn-vision:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(245, 158, 11, 0.7);
            color: #030712;
        }

        .result-box {
            background: rgba(30, 41, 59, 0.85);
            border: 1px solid rgba(245, 158, 11, 0.4);
            border-radius: 1rem;
            padding: 1.5rem;
            margin-top: 2rem;
            display: none;
            text-align: left;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark navbar-custom px-4 py-3">
        <a class="navbar-brand fw-extrabold text-warning tracking-wider" href="#">TERRA VISION 📸</a>
        <a href="/map-transitions" class="btn btn-sm btn-outline-warning fw-bold">🧭 Back to Gateway</a>
    </nav>

    <div class="wrapper-center">
        <div class="vision-card">
            <h2 class="fw-extrabold text-warning mb-2">AI Terrain Vision Classifier</h2>
            <p class="text-light mb-4 small">Upload a photograph of a trekking path, mountain slope, or forest trail. Our CNN model will classify the terrain type and evaluate risk[cite: 3].</p>

            <form id="visionForm">
                <div class="mb-3 text-start">
                    <label class="form-label text-warning small fw-bold">Select Trail Photograph:</label>
                    <input type="file" class="form-control" id="terrainFile" accept="image/*" required>
                </div>
                <button type="submit" class="btn btn-vision w-100">Classify Terrain via CNN AI ⚡</button>
            </form>

            <div id="resultBox" class="result-box text-center">
                <h4 class="text-warning fw-bold mb-2">🎯 AI Analysis Result[cite: 3]</h4>
                <p class="text-light mb-1">Detected Terrain: <b id="terrainName" class="text-info"></b></p>
                <p class="text-light mb-3">Confidence Score: <b id="confidenceScore" class="text-success"></b>%</p>
                
                <form action="/health-questionnaire" method="POST">
                    <input type="hidden" name="terrain_type" id="hiddenTerrain">
                    <button type="submit" class="btn btn-warning fw-bold w-100 py-2 shadow-lg">Proceed to Fitness Questionnaire 🩺</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('visionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            let fileInput = document.getElementById('terrainFile').files[0];
            if (!fileInput) return;

            let btn = document.querySelector('.btn-vision');
            btn.innerText = 'Analyzing Image... 🔍';
            btn.disabled = true;

            let formData = new FormData();
            formData.append('file', fileInput);

            fetch('/api/vision', {
                method: 'POST',
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                btn.innerText = 'Classify Terrain via CNN AI ⚡';
                btn.disabled = false;
                
                let detected = data.terrain || 'Rocky Trail';
                document.getElementById('terrainName').innerText = detected;
                document.getElementById('confidenceScore').innerText = data.confidence || '94.2';
                document.getElementById('hiddenTerrain').value = detected;
                document.getElementById('resultBox').style.display = 'block';
            })
            .catch(err => {
                btn.innerText = 'Classify Terrain via CNN AI ⚡';
                btn.disabled = false;
                alert('Error processing image!');
            });
        });
    </script>
</body>
</html>
